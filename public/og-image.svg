<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="og-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-grad)" />

  <!-- Soft glow orbs -->
  <circle cx="1050" cy="150" r="300" fill="#6366f1" opacity="0.18" filter="blur(60px)" />
  <circle cx="150" cy="500" r="250" fill="#ec4899" opacity="0.12" filter="blur(60px)" />

  <!-- Decorative border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Avatar Badge -->
  <rect x="100" y="100" width="64" height="64" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="132" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">AR</text>

  <!-- Role Kicker -->
  <text x="184" y="126" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#818cf8" letter-spacing="1">REACT NATIVE DEVELOPER</text>
  <text x="184" y="152" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Atul Rajput · Portfolio</text>

  <!-- Big Title -->
  <text x="100" y="270" font-family="Georgia, serif" font-style="italic" font-size="58" font-weight="700" fill="url(#og-text-grad)">
    Fast, polished mobile apps.
  </text>
  <text x="100" y="340" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
    Engineered for feel, 60 FPS &amp; scale.
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Specializing in React Native, Expo, Reanimated 3, and native platform modules.
  </text>

  <!-- Tech tags pills -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="130" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="65" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">React Native</text>

    <rect x="145" y="0" width="80" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="185" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Expo</text>

    <rect x="240" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">TypeScript</text>

    <rect x="375" y="0" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="450" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Reanimated 3</text>
  </g>

  <!-- Domain -->
  <text x="1060" y="525" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="end">
    atulrajput.dev
  </text>
</svg>
