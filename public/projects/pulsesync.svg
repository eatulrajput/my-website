<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)" />

  <!-- Status Bar placeholder -->
  <text x="32" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <circle cx="340" cy="34" r="4" fill="#94a3b8" />
  <circle cx="352" cy="34" r="4" fill="#94a3b8" />
  <rect x="360" y="28" width="18" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- App Header -->
  <text x="24" y="95" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TODAY'S BIOMETRICS</text>
  <text x="24" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">PulseSync Pro</text>

  <!-- Main Metric Card -->
  <rect x="24" y="150" width="342" height="190" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="44" y="184" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Resting Heart Rate</text>
  <text x="44" y="235" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="44" font-weight="800">58 <tspan font-size="20" fill="#ec4899" font-weight="600">BPM</tspan></text>
  <text x="44" y="265" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">↓ 4 bpm from 7-day average</text>

  <!-- Waveform line -->
  <path d="M 44 300 Q 80 270, 110 305 T 160 300 T 200 260 T 225 330 T 250 250 T 270 310 T 310 290 T 345 300" fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" />

  <!-- Secondary Metrics Grid -->
  <rect x="24" y="360" width="163" height="140" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="40" y="392" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Sleep Score</text>
  <text x="40" y="440" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="700">92%</text>
  <rect x="40" y="465" width="130" height="6" rx="3" fill="#334155" />
  <rect x="40" y="465" width="119" height="6" rx="3" fill="#6366f1" />

  <rect x="203" y="360" width="163" height="140" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="219" y="392" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">HRV Balance</text>
  <text x="219" y="440" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="700">76 <tspan font-size="16" fill="#94a3b8">ms</tspan></text>
  <rect x="219" y="465" width="130" height="6" rx="3" fill="#334155" />
  <rect x="219" y="465" width="98" height="6" rx="3" fill="#a855f7" />

  <!-- Sync Status Bar -->
  <rect x="24" y="520" width="342" height="70" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="555" r="10" fill="#10b981" fill-opacity="0.2" />
  <circle cx="50" cy="555" r="4" fill="#10b981" />
  <text x="74" y="550" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">WatermelonDB Synced</text>
  <text x="74" y="568" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">14,280 samples · 0 frame drops</text>

  <!-- Live ECG Trace Panel -->
  <rect x="24" y="605" width="342" height="120" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="44" y="635" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">REAL-TIME JSI STREAM</text>
  <path d="M 44 680 L 100 680 L 115 650 L 130 705 L 145 640 L 160 680 L 220 680 L 235 655 L 250 700 L 265 645 L 280 680 L 345 680" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Navigation -->
  <rect x="0" y="754" width="390" height="90" fill="#0f172a" />
  <line x1="0" y1="754" x2="390" y2="754" stroke="#1e293b" stroke-width="1" />
  <circle cx="97" cy="785" r="4" fill="#6366f1" />
  <circle cx="195" cy="785" r="4" fill="#475569" />
  <circle cx="293" cy="785" r="4" fill="#475569" />
  <rect x="135" y="828" width="120" height="4" rx="2" fill="#475569" />
</svg>
