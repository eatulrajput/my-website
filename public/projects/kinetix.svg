  <rect x="24" y="685" width="342" height="50" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" opacity="0.6" />
  <text x="44" y="715" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Sprint #6 — Max Output</text>

  <!-- Bottom Bar -->
