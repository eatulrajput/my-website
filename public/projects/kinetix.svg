<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#kbg)" />

  <!-- Status Bar -->
  <text x="32" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <rect x="360" y="28" width="18" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="95" fill="#f97316" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">INTERVAL TIMER</text>
  <text x="24" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">Kinetix Athlete</text>

  <!-- Circular Interval Progress Ring -->
  <circle cx="195" cy="270" r="105" fill="none" stroke="#1e293b" stroke-width="16" />
  <circle cx="195" cy="270" r="105" fill="none" stroke="url(#kglow)" stroke-width="16" stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round" />
  
  <text x="195" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SPRINT INTERVAL 4/8</text>
  <text x="195" y="295" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" text-anchor="middle">00:45</text>
  <text x="195" y="325" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Next: Rest (00:15)</text>

  <!-- Audio Coach Floating Capsule -->
  <rect x="24" y="415" width="342" height="60" rx="30" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="56" cy="445" r="18" fill="#f97316" />
  <polygon points="53,438 63,445 53,452" fill="#ffffff" />
  <text x="88" y="442" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">AI Pace Coach Active</text>
  <text x="88" y="458" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Background audio ducking enabled</text>

  <!-- Up Next Timeline (FlashList preview) -->
  <text x="24" y="515" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">WORKOUT TIMELINE</text>

  <rect x="24" y="535" width="342" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="44" y="562" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Sprint #5 — High Cadence</text>
  <text x="44" y="582" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">00:45 · Target 175 SPM</text>
  <text x="320" y="572" fill="#f97316" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">UP NEXT</text>

  <rect x="24" y="610" width="342" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="44" y="637" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Recovery Jog #5</text>
