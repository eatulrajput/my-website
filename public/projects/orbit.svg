<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="obg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="1" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#obg)" />

  <!-- Status Bar -->
  <text x="32" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <rect x="360" y="28" width="18" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="95" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VISION SCANNER</text>
  <text x="24" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">Orbit Ops</text>

  <!-- Camera Viewfinder with Target Reticle -->
  <rect x="24" y="150" width="342" height="300" rx="20" fill="#020617" stroke="#1e293b" stroke-width="1" />
  
  <!-- Camera reticle corners -->
  <path d="M 60 210 L 60 180 L 90 180" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
  <path d="M 330 210 L 330 180 L 300 180" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
  <path d="M 60 390 L 60 420 L 90 420" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
  <path d="M 330 390 L 330 420 L 300 420" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />

  <!-- Barcode Simulation inside reticle -->
  <g transform="translate(110, 275)">
    <rect x="0" y="0" width="6" height="50" fill="#e2e8f0" />
    <rect x="10" y="0" width="12" height="50" fill="#e2e8f0" />
    <rect x="28" y="0" width="4" height="50" fill="#e2e8f0" />
    <rect x="38" y="0" width="16" height="50" fill="#e2e8f0" />
    <rect x="60" y="0" width="8" height="50" fill="#e2e8f0" />
    <rect x="74" y="0" width="14" height="50" fill="#e2e8f0" />
    <rect x="94" y="0" width="6" height="50" fill="#e2e8f0" />
    <rect x="106" y="0" width="18" height="50" fill="#e2e8f0" />
    <rect x="130" y="0" width="8" height="50" fill="#e2e8f0" />
    <rect x="144" y="0" width="12" height="50" fill="#e2e8f0" />
    <rect x="162" y="0" width="8" height="50" fill="#e2e8f0" />
  </g>

  <!-- Green Laser Scan Line -->
  <line x1="40" y1="300" x2="350" y2="300" stroke="url(#scanline)" stroke-width="3" />

  <!-- Recognition Tag -->
  <rect x="95" y="380" width="200" height="34" rx="17" fill="#15803d" />
  <text x="195" y="402" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ SKU-84920 Matched (42ms)</text>

  <!-- Decoded Details Box -->
  <rect x="24" y="470" width="342" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="44" y="504" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">INSPECTION LOG</text>
  <text x="44" y="534" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Titanium Valve Assembly #A-12</text>
  <text x="44" y="558" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Location: Bay 4, Rack 12 · Weight: 2.4 kg</text>
  
  <rect x="44" y="575" width="80" height="24" rx="6" fill="#0284c7" />
  <text x="84" y="591" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VERIFIED</text>

  <!-- Sync status -->
  <rect x="24" y="635" width="342" height="60" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="44" y="670" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Offline queue: 0 pending · CRDT clean</text>

  <!-- Bottom Bar -->
  <rect x="0" y="754" width="390" height="90" fill="#090d16" />
  <rect x="135" y="828" width="120" height="4" rx="2" fill="#475569" />
</svg>
